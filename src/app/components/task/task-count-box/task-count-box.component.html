<div class="relative overflow-hidden rounded-2xl shadow-lg transform transition-all duration-300 hover:scale-105 cursor-pointer"
     [style.background]="color">
  <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent"></div>
  <div class="relative p-6">
    <div class="flex items-center justify-between mb-4">
      <div class="w-10 h-10 rounded-full bg-white/30 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <div class="text-right">
        <div class="w-2 h-2 rounded-full bg-white/50 mb-1"></div>
        <div class="w-1 h-1 rounded-full bg-white/30"></div>
      </div>
    </div>
    <div class="text-white/90 text-sm font-medium mb-2 uppercase tracking-wider">
      {{ title }}
    </div>
    <div class="text-white text-4xl font-bold leading-none">
      {{ count }}
      <span class="text-white/70 text-base font-normal ml-2">tareas</span>
    </div>
  </div>
  <div class="absolute bottom-0 right-0 w-20 h-20 rounded-full bg-white/10 transform translate-x-6 translate-y-6"></div>
  <div class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/5"></div>
</div>
